        <script>
        // Example JS: Show/hide sections based on user role (simulate after login)
        // Replace with real login/session logic and server-provided session state
        function setRoleUI(role) {
            document.querySelectorAll('.root-only').forEach(e => e.style.display = (role === 'root') ? 'block' : 'none');
            document.querySelectorAll('.sales-only').forEach(e => e.style.display = (role === 'sales_staff') ? 'block' : 'none');
            let badge = '';
            if(role === 'root') badge = '<span class="role-badge-root">Root User</span>';
            if(role === 'sales_staff') badge = '<span class="role-badge-sales">Sales Staff</span>';
            document.getElementById('role-badge-container').innerHTML = badge;
        }

        // If signup returned an error via query string, switch to Sign Up tab and show a small alert
        (function(){
            const params = new URLSearchParams(window.location.search);
            if (params.get('signup') === 'error') {
                const msg = params.get('msg') || 'error';
                const signupTab = new bootstrap.Tab(document.querySelector('#signup-tab'));
                signupTab.show();
                const container = document.querySelector('.containerr');
                const alert = document.createElement('div');
                alert.className = 'alert alert-danger mt-3';
                alert.textContent = 'Sign up error: ' + msg;
                container.insertBefore(alert, container.firstChild);
            }
        })();
        </script>
